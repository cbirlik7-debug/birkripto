name: Run Bot Cycle

on:
  schedule:
    - cron: '*/15 * * * *'   # Her 15 dakikada bir (15m timeframe için)
  workflow_dispatch:           # Manuel tetikleme de mümkün olsun

jobs:
  trigger-edge-function:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://rromrgcpklrkxkourmie.supabase.co' }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          AUTH_HEADER=""
          if [ -n "$SUPABASE_SERVICE_ROLE" ]; then
            AUTH_HEADER="Authorization: Bearer $SUPABASE_SERVICE_ROLE"
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${SUPABASE_URL}/functions/v1/run-bot-cycle" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"} \
            -H "Content-Type: application/json")
          echo "HTTP Status: $response"
          if [ "$response" != "200" ]; then
            echo "Edge Function çağrısı başarısız: $response"
            exit 1
          fi
          echo "Bot döngüsü başarıyla tetiklendi!"
