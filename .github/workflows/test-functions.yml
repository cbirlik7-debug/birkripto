name: Test Edge Function Core

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/test-functions.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/test-functions.yml'
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run core tests
        run: deno test supabase/functions/run-bot-cycle/core.test.ts
